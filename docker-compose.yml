
services:
  api:
    build: .
    container_name: industrial-defect-api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/best.pt
      CONFIDENCE_THRESHOLD: "0.25"
      IMAGE_SIZE: "640"
      LOG_LEVEL: INFO
      PLC_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: industrial-defect-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped
